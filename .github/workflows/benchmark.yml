---
name: Performance benchmarks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: Run slow and IBSI workflows too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>release-lookup.log); then
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          else
            echo "No release resolved; PR/master comparison will still run."
            cat release-lookup.log
          fi
      - name: Compare isolated revisions on this runner
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FULL: ${{ inputs.full }}
        shell: bash
        run: |
          args=(--current HEAD --master origin/master --output reports/benchmarks/ci)
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--release "$RELEASE_TAG"); fi
          if [[ "$FULL" == "true" ]]; then args+=(--full); fi
          python tests/benchmarks/compare_revisions.py "${args[@]}"
      - name: Display comparison
        if: always()
        shell: bash
        run: |
          if [[ -f reports/benchmarks/ci/comparison.txt ]]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat reports/benchmarks/ci/comparison.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload timing and environment artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/benchmarks/ci/
            release-lookup.log
          retention-days: 30
          if-no-files-found: warn
